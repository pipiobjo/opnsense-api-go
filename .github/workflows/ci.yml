# SPDX-FileCopyrightText: 2026 opnsense-api-go contributors
# SPDX-License-Identifier: BSD-2-Clause
#
# Every push to main and every pull request:
#   test         format, vet, unit tests with the race detector (fake
#                firewall, real capability test data), no skipped test,
#                coverage with a floor, SBOM (tools/ci/sbom.sh), known
#                vulnerabilities in called code (tools/ci/vulncheck.sh)
#   data         the capability data pinned in tools/ci/catalog-ref
#                (tools/ci/catalog.sh: checksums, attestation, data_id), its
#                format keys against the client's model, and the test matrix:
#                newest verified release of each series
#   integration  per series: throwaway OPNsense VM on 127.0.0.1 with every
#                plugin (the test VM action of opnsense-api-spec at the commit
#                in tools/ci/spec-ref), then the integration tests
#                (test/integration), skips only from tools/ci/skip-allowlist.txt,
#                their coverage (reported; its floor is checked only on a
#                push to main, docs/testing.md "Coverage")
#   plugins      plugins that did not install on any VM: a warning, except
#                on a spec-pin branch, where data is tested only with every
#                plugin installed (spec-update.yml merges only a green pin)
# No schedule, no secrets, nothing published (ADR 0002).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # spec-update.yml starts it on a spec-pin/... branch
  workflow_dispatch:
  # release.yml runs the whole suite before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        # the two supported Go releases: go.mod's minimum and the newest;
        # patch releases arrive without a commit
        go: ["1.26", "1.27"]
    name: test (Go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          minimum_release_age: 7d # only mise releases at least a week old
          mise_toml: |
            [tools]
            go = "${{ matrix.go }}"
      - name: Format, vet, test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
          go vet ./...
          go vet -tags integration ./...
          # -v for the skip check; the log shows failures and test output only
          rc=0
          go test -v -count=1 -race -coverpkg=./... -coverprofile=unit.out ./... > unit.log 2>&1 || rc=$?
          grep -vE '^[[:space:]]*(=== (RUN|PAUSE|CONT|NAME)|--- PASS)' unit.log || true
          [ "$rc" = 0 ] || exit "$rc"
          tools/ci/skips.sh unit.log
          tools/ci/skips_test.sh
      # statements covered per package; fails below tools/ci/coverage-floor.txt
      - name: Coverage
        if: matrix.go == '1.27'
        run: tools/ci/coverage.sh unit unit.out coverage
      # the tolerance files of the integration test and the CI scripts
      - name: Shell scripts
        if: matrix.go == '1.27'
        run: bash -n tools/ci/*.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.go == '1.27'
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 30
      # reachable vulnerabilities with a fix fail; without a fix: warning
      - name: Vulnerabilities (govulncheck)
        if: matrix.go == '1.27'
        run: tools/ci/vulncheck.sh
      # the same SBOM step as a release, so it is tested before one
      - name: SBOM
        if: matrix.go == '1.27'
        run: tools/ci/sbom.sh sbom/opnsense-api-go.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.go == '1.27'
        with:
          name: sbom
          path: sbom/
          retention-days: 30
      # the seeds of the fuzz targets run above as plain tests; here each
      # target also gets generated inputs for a few seconds
      - name: Fuzz
        if: matrix.go == '1.27'
        run: |
          go test -run='^$' -fuzz='^FuzzWireDecode$' -fuzztime=10s ./opnsense/capability/
          go test -run='^$' -fuzz='^FuzzLoad$' -fuzztime=10s ./opnsense/capability/
          go test -run='^$' -fuzz='^FuzzCheckID$' -fuzztime=10s ./opnsense/
          go test -run='^$' -fuzz='^FuzzCheckPath$' -fuzztime=10s ./internal/transport/

  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.data.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }} # gh attestation verify only; downloads are anonymous
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          minimum_release_age: 7d # only mise releases at least a week old
      - name: Capability data (tools/ci/catalog-ref)
        id: data
        run: |
          matrix=$(tools/ci/catalog.sh catalog | tail -n 1)
          jq -e 'length > 0' <<<"$matrix" >/dev/null
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "### Integration matrix" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- \(.release)"' <<<"$matrix" >> "$GITHUB_STEP_SUMMARY"
      # every key of the downloaded format is read by the client or ignored
      # on purpose; a key the spec added since the test data fails here
      - name: Format keys of this data
        run: OPNSENSE_CAPABILITIES="$PWD/catalog" go test -count=1 -run '^TestModelMatchesSchema$' -v ./opnsense/capability/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog
          path: catalog/
          retention-days: 3

  integration:
    needs: [test, data]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.data.outputs.matrix) }}
    name: integration (${{ matrix.release }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          minimum_release_age: 7d # only mise releases at least a week old
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog
          path: catalog
      # the one pin on opnsense-api-spec (tools/ci/spec-ref.sh); spec-update.yml
      # proposes a new one when the spec's main moves
      - name: Spec commit
        id: spec
        run: echo "ref=$(tools/ci/spec-ref.sh get)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pipiobjo/opnsense-api-spec
          ref: ${{ steps.spec.outputs.ref }}
          path: .spec
          persist-credentials: false
      - name: Test VM ${{ matrix.release }} with all plugins
        id: vm
        uses: ./.spec/.github/actions/testvm
        with:
          series: ${{ matrix.series }}
          release: ${{ matrix.release }}
          plugins: all
          require-plugins: "false"
      - name: Integration tests
        env:
          OPNSENSE_URL: ${{ steps.vm.outputs.url }}
          OPNSENSE_KEYFILE: ${{ steps.vm.outputs.keyfile }}
          OPNSENSE_CAPABILITIES: ${{ github.workspace }}/catalog
          # every plugin was requested: a test that needs a missing one fails
          OPNSENSE_PLUGINS: all
          # request timeouts stretched by the factor the VM harness used for
          # its own waits (an output of the spec's test VM action)
          TESTVM_SLOW: ${{ steps.vm.outputs.slow }}
        run: |
          echo "instance ${{ steps.vm.outputs.version }}, ${{ steps.vm.outputs.acceleration }} (waits x${{ steps.vm.outputs.slow }}), plugins not installed: ${{ steps.vm.outputs.failed || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          go test -count=1 -tags integration -timeout 150m -v \
            -coverpkg=github.com/pipiobjo/opnsense-api-go/... -coverprofile=integration.out \
            ./test/integration/ 2>&1 | tee integration.log
          {
            echo '```'
            grep -E '^(--- FAIL|--- SKIP|ok|FAIL)|tested [0-9]+ resources' integration.log | head -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tools/ci/skips.sh integration.log | tee -a "$GITHUB_STEP_SUMMARY"
      # for the plugins job: what did not install on this VM (may be empty)
      - name: Plugins not installed
        if: always() && steps.vm.outputs.url != ''
        env:
          FAILED: ${{ steps.vm.outputs.failed }}
        run: mkdir -p plugins && printf '%s' "$FAILED" > "plugins/${{ matrix.release }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.vm.outputs.url != ''
        with:
          name: plugins-${{ matrix.release }}
          path: plugins/
          retention-days: 3
      # client code exercised against the real firewall: depends on what
      # the VM does, so its floor is checked only on a push to main
      - name: Coverage
        env:
          COVERAGE_ENFORCE: ${{ github.event_name == 'push' && '1' || '0' }}
        run: tools/ci/coverage.sh integration integration.out coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration-${{ matrix.release }}
          path: coverage/
          retention-days: 30
      - name: Stop test VM
        if: always() && steps.spec.outputs.ref != ''
        uses: ./.spec/.github/actions/testvm
        with:
          command: stop
      # also when the job passed but a plugin did not install: the firmware
      # log of each failed install (install-<plugin>.log) explains it
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || steps.vm.outputs.failed != ''
        with:
          name: logs-${{ matrix.release }}
          path: |
            integration.log
            ${{ steps.vm.outputs.dir }}/*.log
          retention-days: 14 # longer than the watchdog's 7 days

  # did a plugin fail to install on any VM? A test of data with missing
  # plugins is not a full test: a warning on pushes and pull requests, a
  # failure on a spec-pin branch, so new data is pinned only when every
  # plugin's resources ran
  plugins:
    needs: [data, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugins-*
          merge-multiple: true
          path: plugins
      - name: Missing plugins
        id: missing
        env:
          MATRIX: ${{ needs.data.outputs.matrix }}
        run: |
          missing=""
          for r in $(jq -r '.[].release' <<<"$MATRIX"); do
            [ -f "plugins/$r.txt" ] || { echo "::error::no plugin report from the $r VM"; exit 1; }
            f=$(cat "plugins/$r.txt")
            [ -z "$f" ] || missing+="$r: $f"$'\n'
          done
          echo "plugins not installed: ${missing:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$missing" ]; then
            case "$GITHUB_REF" in
              refs/heads/spec-pin/*) echo "::error::new data is pinned only when every plugin installed"; exit 1 ;;
              *) echo "::warning::plugins did not install; their resources were not tested in this run" ;;
            esac
          fi

  # the one required status check of main (ruleset "main: tested"): its
  # name does not depend on the release matrix, which changes with the data
  passed:
    name: ci passed
    if: always()
    needs: [test, data, integration, plugins]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      statuses: write # the commit status below
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "jobs: $RESULTS"
          jq -e 'length == 4 and all(. == "success")' <<<"$RESULTS" >/dev/null
      # The ruleset "main: tested" does not count the check runs of a
      # workflow_dispatch run (the pin branch of spec-update.yml): its pull
      # request showed no checks at all and stayed blocked (PR #2,
      # 2026-11-25), and a fast-forward was refused the same way. A commit
      # status is bound to the commit itself, so a passed dispatch run
      # sets one; GitHub Actions is the app the rule names. Push and
      # pull_request runs do not need it.
      - name: Commit status for the ruleset
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success \
            -f context="ci passed" -f target_url="$RUN_URL" -f description="ci.yml passed (workflow_dispatch)" >/dev/null
          echo "status 'ci passed' set on ${GITHUB_SHA:0:12}"
