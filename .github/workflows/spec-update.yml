#
# When opnsense-api-spec has published new data (a new OPNsense release,
# hotfix or plugin update), run the whole client suite against it: unit
# tests, then the integration tests on the newest release of each series
# with every plugin (ci.yml). Each data version is tested once; days
# without new data end after one small download (ADR 0002). A run in
# which a plugin did not install is not recorded as a test of that data:
# the next day tests it again.
#
# The job spec-pin keeps the one pin on opnsense-api-spec (tools/ci/spec-ref,
# the test VM action and the watchdog script) at the spec's main: it
# commits a new pin to a branch spec-pin/..., starts ci.yml there, and
# automerge.yml moves main to exactly that commit when ci.yml passed.
#
# A failure notifies nobody. watchdog.yml opens the one "needs-you" issue
# when this workflow has not succeeded for 7 days, and closes it again.
#
# Schedule: daily while the client is pre-release; weekly or monthly once
# a stable version is released (change the cron line, ADR 0002).
name: spec-update

on:
  schedule:
    - cron: "17 10 * * *" # the spec pipeline starts 05:17 UTC and takes up to 2 hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      tested: ${{ steps.seen.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hash of the newest published data
        id: hash
        run: |
          h=$(tools/ci/data-hash.sh)
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          echo "data: $h" >> "$GITHUB_STEP_SUMMARY"
      - name: Already tested?
        id: seen
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tested
          key: tested-${{ steps.hash.outputs.hash }}
          lookup-only: true

  test:
    needs: check
    if: needs.check.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml

  # only a run with every plugin installed tested the data completely
  remember:
    needs: [check, test]
    if: needs.test.outputs.missing-plugins == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: mkdir -p .tested && echo "${{ needs.check.outputs.hash }}" > .tested/hash
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tested
          key: tested-${{ needs.check.outputs.hash }}

  not-remembered:
    needs: [check, test]
    if: needs.test.outputs.missing-plugins != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          MISSING: ${{ needs.test.outputs.missing-plugins }}
        run: |
          echo "::warning::plugins did not install, so this data is not recorded as tested; the next run tests it again"
          { echo "Not recorded as tested; plugins not installed:"; echo '```'; echo "$MISSING"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  spec-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the branch spec-pin/...
      actions: write # start ci.yml on it
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Propose the spec's main as the new pin
        run: |
          cur=$(tools/ci/spec-ref.sh get)
          new=$(tools/ci/spec-ref.sh latest)
          if [ "$cur" = "$new" ]; then
            echo "pin ${cur:0:12} is the spec's main" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            base=$(git rev-parse HEAD)
            branch="spec-pin/${new:0:12}-${base:0:12}"
            if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
              # proposed before on this main: its ci.yml run decides; a
              # failed one keeps this job red, which the watchdog reports
              # after 7 days. A passed one is merged here: automerge.yml
              # never sees it, because GitHub starts no workflow_run for a
              # run that the job token started (seen 2026-11-19 and -20).
              read -r state sha < <(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml -b "$branch" -e workflow_dispatch -L 1 \
                --json status,conclusion,headSha -q '.[0] | if . == null then "none -" elif .status != "completed" then "running -" else "\(.conclusion) \(.headSha)" end')
              case "$state" in
                running) echo "ci.yml on $branch is running" ;;
                none) gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$branch"; echo "started ci.yml on $branch" ;;
                success)
                  tip=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
                  [ "$tip" = "$sha" ] || { echo "::error::$branch is at ${tip:0:12}, but ci.yml passed on ${sha:0:12}"; exit 1; }
                  # the same checks as automerge.yml: one commit on top of
                  # main, touching the pin file only; fast-forward only
                  cmp=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$sha")
                  files=$(jq -r '[.files[].filename] | join(" ")' <<<"$cmp")
                  if [ "$files" != tools/ci/spec-ref ] || [ "$(jq .ahead_by <<<"$cmp")" != 1 ] || [ "$(jq .behind_by <<<"$cmp")" != 0 ]; then
                    echo "::error::$branch must be one commit on main changing tools/ci/spec-ref only: $files"; exit 1
                  fi
                  gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f sha="$sha" -F force=false >/dev/null
                  gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
                  echo "main is now ${sha:0:12}: spec pin ${new:0:12}, tested by ci.yml on $branch" | tee -a "$GITHUB_STEP_SUMMARY" ;;
                *) echo "::error::new spec pin ${new:0:12} on $branch: ci.yml $state and main not moved"; exit 1 ;;
              esac
            else
              tools/ci/spec-ref.sh set "$new"
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -q -m "ci: pin opnsense-api-spec ${new:0:12}" tools/ci/spec-ref
              git push -q origin "HEAD:refs/heads/$branch"
              gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$branch"
              echo "proposed spec pin ${new:0:12} on $branch; ci.yml started" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
      # automerge.yml merges Dependabot updates by itself; one still open
      # after 14 days could not be merged and needs a look
      - name: Dependabot updates left open
        run: |
          old=$(gh pr list -R "$GITHUB_REPOSITORY" --author app/dependabot --state open --json number,createdAt \
            -q "[.[] | select(.createdAt < \"$(date -u -d '14 days ago' +%FT%TZ)\") | .number] | join(\" \")")
          [ -z "$old" ] || { echo "::error::Dependabot pull requests open for more than 14 days: $old"; exit 1; }

  # GitHub disables scheduled workflows of public repositories after 60
  # days without activity; this and the watchdog re-enable each other
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/spec-update.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watchdog.yml/enable"
