#
# Dependabot updates (.github/dependabot.yml: monthly, grouped, only
# versions at least 7 days old) reach main without a person (ADR 0002):
# this workflow turns on GitHub's auto-merge for each Dependabot pull
# request, and GitHub merges it once the ruleset "main: tested" is met
# (status check "ci passed" green on a branch that is up to date with
# main). This is the pattern GitHub documents for Dependabot ("Automating
# Dependabot with GitHub Actions"). The earlier workflow_run design never
# ran for runs started by a job token, see spec-update.yml.
#
# Nothing of the pull request is checked out or run here. The other change
# made without a person, the spec pin, is merged by spec-update.yml.
name: automerge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  enable:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'pipiobjo/opnsense-api-go'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      # rebase: linear history; main gets the tested tree, as new commits
      - run: gh pr merge --auto --rebase "$PR_URL"
