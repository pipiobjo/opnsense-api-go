# SPDX-License-Identifier: BSD-2-Clause
#
# A release is a version tag (v1.2.3) pushed by a maintainer; nothing else
# starts this workflow. Go users get the module through the Go module
# proxy by the tag alone; this workflow adds the evidence:
#   test     the whole suite of ci.yml (unit tests with coverage, the
#            integration tests on the newest release of each series)
#   release  SBOM (CycloneDX, tools/ci/sbom.sh), SHA256SUMS, provenance
#            attestation of both, and a GitHub release with them and the
#            coverage reports. Versions below v1 are marked pre-release.
# Tags v* are protected by a ruleset: never moved or deleted.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write     # the GitHub release
      id-token: write     # keyless provenance attestation (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the module version in the SBOM comes from the tag
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          minimum_release_age: 7d # only mise releases at least a week old
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-unit
          path: out/coverage
      - name: SBOM and checksums
        run: |
          tag="${GITHUB_REF_NAME}"
          tools/ci/sbom.sh "out/opnsense-api-go-$tag.cdx.json"
          v=$(jq -r '.metadata.component.version' "out/opnsense-api-go-$tag.cdx.json")
          [ "$v" = "$tag" ] || { echo "::error::SBOM version $v is not the tag $tag"; exit 1; }
          (cd out/coverage && mv unit.html "../opnsense-api-go-$tag.coverage-unit.html")
          rmdir out/coverage
          (cd out && sha256sum -- * > SHA256SUMS)
          cat out/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          pre=()
          case "$tag" in v0.*|*-*) pre=(--prerelease) ;; esac
          gh release create "$tag" --verify-tag "${pre[@]}" --title "$tag" \
            --notes "Go module: \`go get github.com/pipiobjo/opnsense-api-go@$tag\`. Attached: SBOM (CycloneDX 1.6), unit test coverage report, SHA256SUMS. Verify: \`sha256sum -c SHA256SUMS\`; provenance: \`gh attestation verify <file> -R $GITHUB_REPOSITORY\`. What is tested: docs/testing.md." \
            out/*
