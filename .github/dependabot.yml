# The module has no dependencies outside the Go standard library; this
# covers the pinned actions (including the spec repository's test VM
# action). Monthly, grouped, only versions at least 7 days old, so a
# compromised release has time to be noticed before it reaches this
# repository. A pull request is merged by GitHub once "ci passed" is
# green (automerge.yml, ruleset "main: tested", ADR 0002 point 5).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
